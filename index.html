<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <p class="script">Happy Birthday</p>
  <!-- 👉 แก้ชื่อแฟนตรงนี้ -->
  <p class="subname">มีความสุขมากๆเด็กดื้อ</p>
  <p class="tag">มีเซอร์ไพรส์เล็ก ๆ รออยู่ในซองนี้นะ 💕</p>

  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="เปิดการ์ดอวยพร">
    <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="20" width="192" height="112" rx="14" fill="url(#g1)"/>
      <path d="M4 30 L100 95 L196 30" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="66" r="14" fill="#fff"/>
      <text x="100" y="72" font-size="16" text-anchor="middle">💗</text>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffc2dd"/>
          <stop offset="1" stop-color="#c9b6fb"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <p class="envelope-label">กดตรงนี้เพื่อเปิด</p>
</main>

<script src="js/hearts.js"></script>
<script>
  const env = document.getElementById('envelope');
  function openEnvelope() {
    env.classList.add('open');
    setTimeout(() => { window.location.href = 'message.html'; }, 550);
  }
  env.addEventListener('click', openEnvelope);
  env.addEventListener('keypress', e => { if (e.key === 'Enter') openEnvelope(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รูปความทรงจำ 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="page">
  <p class="script" style="font-size:clamp(1.8rem,7vw,2.6rem)">Our Memories</p>
  <p class="tag">รูปความทรงจำ 📸</p>

  <!-- ==========================================================
       👉 วิธีใส่รูป:
       1) เอาไฟล์รูปไปวางในโฟลเดอร์ images/ (ในโปรเจกต์นี้)
       2) ตั้งชื่อไฟล์ให้ตรงกับ src ด้านล่าง (photo1.jpg, photo2.jpg, ...)
          หรือจะแก้ src ให้ตรงกับชื่อไฟล์จริงของคุณก็ได้
       3) อยากเพิ่ม/ลดรูป ก็ copy บล็อก <figure>...</figure> เพิ่มหรือลบได้เลย
     ========================================================== */ -->
  <div class="gallery">
    <figure><img src="images/photo1.jpg" alt="ความทรงจำ 1" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo1.jpg</span>'"></figure>
    <figure><img src="images/photo2.jpg" alt="ความทรงจำ 2" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo2.jpg</span>'"></figure>
    <figure><img src="images/photo3.jpg" alt="ความทรงจำ 3" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo3.jpg</span>'"></figure>
    <figure><img src="images/photo4.jpg" alt="ความทรงจำ 4" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo4.jpg</span>'"></figure>
    <figure><img src="images/photo5.jpg" alt="ความทรงจำ 5" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo5.jpg</span>'"></figure>
    <figure><img src="images/photo6.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo7.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo8.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo9.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo10.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo11.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
    <figure><img src="images/photo12.jpg" alt="ความทรงจำ 6" onerror="this.closest('figure').innerHTML='<span class=\'placeholder\'>ใส่รูปที่นี่<br>images/photo6.jpg</span>'"></figure>
  </div>

  <footer class="sign">ทำด้วยหัวใจ เพื่อคนพิเศษของฉัน 🎂</footer>
  <a class="btn-ghost" href="index.html">‹ เปิดดูอีกครั้งตั้งแต่ต้น</a>
</main>

<script src="js/hearts.js"></script>
</body>
</html>
